# The specification of the Publet Protocol and the design documents for this
# implementation, built with pubdoc (./pubdoc, which runs the release
# requirements-pubdoc.txt pins). Each doc holds one of the two parts.
project: design
purpose: The Publet Protocol's specification, and plans for implementing it and for making it describe itself
parts:
  specification: {required: false}
  plan: {required: false}
roles:
  contributors: [schryer]
  reviewers: [schryer]
variants:
  general: {audience: Publet Protocol implementers}
layouts:
  classicthesis: {part: specification, template: ../templates/classicthesis-typst, format: pdf}
  lapreprint: {part: plan, template: lapreprint-typst, format: pdf}
review:
  - step: checks
    automatic: [build]
  - step: approval
    human: {reviewers: 1}
# Approved renders go to storage's public publet-design tenant (the repository
# is public), and versions are signed in design/corpus with a key of its own,
# never the one that signs publet's releases: made on 2026-11-19, backed up as
# pub-signing-key-publet-design.
storage: {tenant: publet-design}
corpus: {path: corpus, key: pub:sha2-256:s26mmpjds7nfh4bdtzwgso4udnjlzglg2symwt5jodeu6xcllh5a}
publish:
  - place: storage
    layouts: [classicthesis, lapreprint]
    readers: named
