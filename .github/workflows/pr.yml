# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"gates": "guard-floats guard-deps guard-rules guard-msrv", "required": "fmt-check lint doc doc-coverage-check publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"test-args": "--workspace --all-features"}

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"apt-packages": "jq", "functional": "guard-eval conformance coverage-check script-tests", "required": "functional vectors-check supply-chain-check"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2

  review:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-review.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2

  sonar:
    name: ci
    needs: [functional]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=crates -Dsonar.tests=tests,fuzz"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    uses: Sustenaut/pubrel/.github/workflows/release.yml@5395ddd816d9530b649b92ed0b8b3cfdfe87d7dc # v0.6.1
    with: {"pubrel-version": "v0.6.1", "semver-checks-version": "0.51.0"}
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
