# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"gates": "guard-floats guard-deps guard-rules guard-msrv", "required": "fmt-check lint doc doc-coverage-check publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"test-args": "--workspace --all-features"}

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"apt-packages": "jq", "functional": "guard-eval conformance coverage-check script-tests", "required": "functional vectors-check supply-chain-check"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"cross-test-args": "--workspace --all-features"}

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  review:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-review.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  sonar:
    name: ci
    needs: [functional]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=crates -Dsonar.tests=tests,fuzz"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    uses: Sustenaut/pubrel/.github/workflows/release.yml@16c6c9731b3f41639d45160e8bb73d59d8562e04 # v0.5.5
    with: {"pubrel-version": "v0.5.5", "semver-checks-version": "0.51.0"}
    permissions:
      contents: write
