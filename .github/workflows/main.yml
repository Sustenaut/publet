# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: schryer/pubkit/.github/workflows/job-rust-gates.yml@v0.14.0
    with: {"gates": "guard-floats guard-deps guard-rules guard-msrv", "required": "fmt-check lint doc doc-coverage-check publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: schryer/pubkit/.github/workflows/job-rust-test.yml@v0.14.0
    with: {"test-args": "--workspace --all-features"}

  functional:
    name: ci
    needs: [gates]
    uses: schryer/pubkit/.github/workflows/job-rust-functional.yml@v0.14.0
    with: {"apt-packages": "jq", "functional": "guard-eval conformance coverage-check script-tests", "required": "functional vectors-check supply-chain-check"}
    secrets: inherit

  msrv:
    name: ci
    needs: [gates]
    uses: schryer/pubkit/.github/workflows/job-rust-msrv.yml@v0.14.0

  fuzz:
    name: ci
    needs: [gates]
    uses: schryer/pubkit/.github/workflows/job-rust-fuzz.yml@v0.14.0

  cross:
    name: ci
    needs: [gates]
    uses: schryer/pubkit/.github/workflows/job-rust-cross.yml@v0.14.0
    with: {"cross-test-args": "--workspace --all-features"}

  audit:
    name: ci
    uses: schryer/pubkit/.github/workflows/job-rust-audit.yml@v0.14.0
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: schryer/pubkit/.github/workflows/job-osv.yml@v0.14.0

  sonar:
    name: ci
    needs: [functional]
    uses: schryer/pubkit/.github/workflows/job-sonar.yml@v0.14.0
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml"}
    secrets: inherit

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    uses: schryer/pubrel/.github/workflows/release.yml@v0.5.4
    with: {"pubrel-version": "v0.5.4", "semver-checks-version": "0.51.0"}
    permissions:
      contents: write
