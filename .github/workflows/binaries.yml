# Attaches a prebuilt `pub` to each publet-cli release, so a runner that
# drives pub (pubdoc's verify, in any repository) downloads it by a sha256
# it pins instead of compiling it. pubrel's release workflow, in main, tags
# vX.Y.Z and creates its GitHub release; when main's run finishes, this
# builds that tag's `pub` and uploads
#
#   pub-X.Y.Z-x86_64-unknown-linux-musl.tar.gz          the binary, `pub`
#   pub-X.Y.Z-x86_64-unknown-linux-musl.tar.gz.sha256   its sha256, sha256sum's format
#
# The binary is static (musl), so it runs on any x86-64 Linux, whatever its
# glibc. It is built at the tag from a clean tree, so `pub --version` says
# it is that release. A release that already has the archive, or a version
# not yet released, does nothing. Run it by hand, naming a tag, to attach an
# earlier release's binary.
name: binaries

on:
  workflow_run:
    workflows: [main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "A publet-cli release tag, vX.Y.Z (default: the version main holds)"
        required: false

permissions:
  contents: read

jobs:
  pub:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Which release, and whether it needs its binary
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "publet-cli") | .version')"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vX.Y.Z tag"; exit 1; }
          archive="pub-${TAG#v}-$TARGET.tar.gz"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is not released"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$archive"; then
            echo "$archive already attached"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      # At the tag, from a clean tree (only that tag fetched): then `pub --version`
      # claims the release.
      - if: steps.release.outputs.build == 'true'
        name: Build pub at the tag, static
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --quiet --depth 1 origin tag "$TAG"
          git checkout --quiet "$TAG"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add "$TARGET"
          cargo build --release --locked -p publet-cli --target "$TARGET"
          bin="target/$TARGET/release/pub"
          version="$("$bin" --version | head -n 1)"
          [ "$version" = "pub ${TAG#v}" ] || { echo "::error::the build says '$version', not 'pub ${TAG#v}'"; exit 1; }
          file "$bin" | grep -q "statically linked\|static-pie linked" || { echo "::error::$bin is not static: $(file "$bin")"; exit 1; }
      - if: steps.release.outputs.build == 'true'
        name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          tar -czf "$ARCHIVE" -C "target/$TARGET/release" pub
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256"
