# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: queue

on:
  merge_group:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0
    with: {"gates": "guard-floats guard-deps guard-rules guard-msrv", "required": "fmt-check lint doc doc-coverage-check publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0
    with: {"test-args": "--workspace --all-features"}

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0
    with: {"apt-packages": "jq", "functional": "guard-eval conformance coverage-check script-tests", "required": "functional vectors-check supply-chain-check"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0
    with: {"cross-test-args": "--workspace --all-features"}

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@76a2bfd5576197551434cc6e321ede78a4d667d1 # v0.42.0

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    uses: Sustenaut/pubrel/.github/workflows/release.yml@d0295449195990fc2813ba91945b265a8c0cf040 # v0.7.1
    with: {"pubrel-version": "v0.7.1", "semver-checks-version": "0.51.0"}
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
